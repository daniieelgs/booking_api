services:
  web:
    image: booking-flask
    environment:
      - PORT=${PORT:-5000}
      - FLASK_ENV=${FLASK_ENV:-development}
      - FLASK_DEBUG=${FLASK_DEBUG:-1}
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    volumes:
      - ..:/app
    depends_on:
      database:
        condition: service_started
      redis:
        condition: service_healthy
    restart: always

  database:
    image: mariadb:10.5.19
    ports:
      - "${DB_PORT:-3307}:3306"
    environment:
      - TZ=Europe/Madrid
    env_file:
      - ../db/.env
    volumes:
      - db-data:/var/lib/mysql
      - ../db/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always

  worker:
    image: booking-base
    command: celery -A make_celery.celery worker --loglevel=info -Q priority,default
    volumes:
      - ..:/app
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_started
    restart: always

  beat:
    image: booking-base
    command: celery -A make_celery.celery beat --loglevel=info
    volumes:
      - ..:/app
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_started
    restart: always

  redis:
    image: redis:7.2.4-bookworm
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis} --save 60 1 --appendonly yes --appendfsync everysec --loglevel warning --maxmemory 256mb --maxmemory-policy noeviction
    environment:
      - TZ=Europe/Madrid
      - REDISCLI_AUTH=${REDIS_PASSWORD:-redis}
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - redis-data:/data

volumes:
  db-data:
  redis-data: