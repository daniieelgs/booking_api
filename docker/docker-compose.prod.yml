version: '3'
services:
  web:
    image: booking-flask
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - FLASK_DEBUG=${FLASK_DEBUG:-0}
      - TZ=Europe/Madrid
      - PORT=${PORT:-443}
      - SSL_CERT_FILE=${SSL_CERT_FILE}
      - SSL_KEY_FILE=${SSL_KEY_FILE}
      - SERVER_NAME=${SERVER_NAME}
      - APACHE_LOG_DIR=/var/log/apache2
    volumes:
      - ${SSL_CERT_FILE}:/etc/ssl/certs/fullchain.pem:ro
      - ${SSL_KEY_FILE}:/etc/ssl/private/privkey.pem:ro
      - ..:/app
    ports:
      - "${PORT:-443}:443"
    depends_on:
      database:
        condition: service_started
      redis:
        condition: service_healthy
    restart: always

  database:
    image: mariadb:10.5.19
    ports:
      - "${DB_PORT:-3307}:3306"
    environment:
      - TZ=Europe/Madrid
    env_file:
      - ../db/.env
    volumes:
      - db-data:/var/lib/mysql
      - ../db/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always

  worker:
    image: booking-base
    command: celery -A make_celery.celery worker --loglevel=info -Q priority,default
    user: "1000:1000"
    volumes:
      - ..:/app
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_started
    restart: always
    labels:
      - autoheal=true
    healthcheck:
      test: ["CMD-SHELL", "celery -A make_celery.celery inspect ping -d celery@$$HOSTNAME -t 15"]
      interval: 300s
      timeout: 30s
      retries: 3
      start_period: 60s

  beat:
    image: booking-base
    command: celery -A make_celery.celery beat --loglevel=info
    user: "1000:1000"
    volumes:
      - ..:/app
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_started
    restart: always

  redis:
    image: redis:7.2.4-bookworm
    command: redis-server --requirepass ${REDIS_PASSWORD} --save 60 1 --loglevel warning --maxmemory 256mb --maxmemory-policy allkeys-lru
    environment:
      - TZ=Europe/Madrid
      - REDISCLI_AUTH=${REDIS_PASSWORD}
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - redis-data:/data

  autoheal:
    image: willfarrell/autoheal:1.2.0
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always

volumes:
  db-data:
  redis-data: