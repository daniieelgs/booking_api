version: '3'
services:
  web:
    image: booking-flask
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
      - FLASK_DEBUG=${FLASK_DEBUG:-0}
      - TZ=Europe/Madrid
      - PORT=${PORT:-443}
      - SSL_CERT_FILE=${SSL_CERT_FILE}
      - SSL_KEY_FILE=${SSL_KEY_FILE}
      - SERVER_NAME=${SERVER_NAME}
      - APACHE_LOG_DIR=/var/log/apache2
    volumes:
      - ${SSL_CERT_FILE}:/etc/ssl/certs/fullchain.pem:ro
      - ${SSL_KEY_FILE}:/etc/ssl/private/privkey.pem:ro
      - ..:/app
    ports:
      - "${PORT:-443}:443"
    depends_on:
      database:
        condition: service_started
      redis:
        condition: service_healthy
    restart: always

  database:
    image: mariadb:10.5.19
    # Binary log = continuous, transaction-level incremental backup (point-in-time recovery, see docs/db-backups.md).
    # --log-bin needs an explicit basename: the default derives from the container hostname, which changes
    # every time the container is recreated and would orphan the previous logs.
    command: >
      --log-bin=mysql-bin
      --binlog-format=ROW
      --binlog-row-image=FULL
      --server-id=1
      --expire-logs-days=7
      --max-binlog-size=104857600
      --sync-binlog=1
    ports:
      - "${DB_PORT:-3307}:3306"
    environment:
      - TZ=Europe/Madrid
    env_file:
      - ../db/.env
    volumes:
      - db-data:/var/lib/mysql
      - ../db/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always

  worker:
    image: booking-base
    command: celery -A make_celery.celery worker --loglevel=info -Q priority,default
    user: "1000:1000"
    volumes:
      - ..:/app
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_started
    restart: always
    labels:
      - autoheal=true
    healthcheck:
      test: ["CMD-SHELL", "celery -A make_celery.celery inspect ping -d celery@$$HOSTNAME -t 15"]
      interval: 300s
      timeout: 30s
      retries: 3
      start_period: 60s

  beat:
    image: booking-base
    command: celery -A make_celery.celery beat --loglevel=info
    user: "1000:1000"
    volumes:
      - ..:/app
    depends_on:
      redis:
        condition: service_healthy
      database:
        condition: service_started
    restart: always

  redis:
    image: redis:7.2.4-bookworm
    command: redis-server --requirepass ${REDIS_PASSWORD} --save 60 1 --appendonly yes --appendfsync everysec --loglevel notice --maxmemory 256mb --maxmemory-policy noeviction
    environment:
      - TZ=Europe/Madrid
      - REDISCLI_AUTH=${REDIS_PASSWORD}
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - redis-data:/data

  autoheal:
    image: willfarrell/autoheal:1.2.0
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: always

  # Database backups: nightly dump + closed binlogs, delivered encrypted to the secondary with retries.
  # Uses a dedicated least-privilege DB user (scripts/create-backup-db-user.sh), never root, and only sees
  # the network, the backup volume and docker/secrets/; none of the application's files or secrets.
  backup:
    image: booking-backup
    restart: always
    environment:
      - TZ=Europe/Madrid
      - DB_HOST=database
      - DB_PORT=3306
      - DB_NAME=${BACKUP_DB_NAME}
      - DB_USER=${BACKUP_DB_USER:-backup}
      - DB_PASSWORD=${BACKUP_DB_PASSWORD}
      - DUMP_HOUR=${BACKUP_DUMP_HOUR:-4}
      - DUMP_MINUTE=${BACKUP_DUMP_MINUTE:-0}
      - BINLOG_SHIP_HOURS=${BACKUP_BINLOG_SHIP_HOURS:-6}
      - LOCAL_KEEP_DUMPS=${BACKUP_LOCAL_KEEP_DUMPS:-2}
      - LOCAL_BINLOG_DAYS=${BACKUP_LOCAL_BINLOG_DAYS:-7}
      - AGE_RECIPIENT=${BACKUP_AGE_RECIPIENT:-}
      - REMOTE_HOST=${BACKUP_REMOTE_HOST:-}
      - REMOTE_PORT=${BACKUP_REMOTE_PORT:-22}
      - REMOTE_USER=${BACKUP_REMOTE_USER:-dbbackup}
      - REMOTE_PATH=${BACKUP_REMOTE_PATH:-/}
      - KUMA_PUSH_URL=${BACKUP_KUMA_PUSH_URL:-}
      - RESTORE_DB_ROOT_PASSWORD=${RESTORE_DB_ROOT_PASSWORD:-restore-scratch}
    volumes:
      - ../dbbackup:/opt/dbbackup:ro
      - backup-data:/backups
      - ./secrets:/run/secrets:ro
    depends_on:
      database:
        condition: service_started
    labels:
      - autoheal=true
    healthcheck:
      test: ["CMD", "python3", "-m", "dbbackup.healthcheck"]
      interval: 300s
      timeout: 15s
      retries: 3
      start_period: 120s

  # Throw-away MariaDB used by scripts/restore.sh to rebuild the past. Never started with the stack
  # (profile "restore"), no published ports, and its data is deleted when the restore ends.
  restore-db:
    image: mariadb:10.5.19
    profiles: ["restore"]
    command: --skip-log-bin --innodb-flush-log-at-trx-commit=2
    environment:
      - TZ=Europe/Madrid
      - MARIADB_ROOT_PASSWORD=${RESTORE_DB_ROOT_PASSWORD:-restore-scratch}

volumes:
  db-data:
  redis-data:
  backup-data: