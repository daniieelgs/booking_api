[pytest]
testpaths = tests
markers =
    services: needs real MariaDB/Redis/Celery from docker/docker-compose.test.yml (run with RUN_INTEGRATION_TESTS=1, see tests/integration/services/README.md)
    resilience: slow services tests that stop/restart the compose containers or the Celery worker (subset of services)
addopts = -m "not services"
filterwarnings =
    ignore::sqlalchemy.exc.LegacyAPIWarning
