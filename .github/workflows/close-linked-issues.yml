name: close-linked-issues

# GitHub solo cierra automáticamente "Closes #n" cuando la PR se fusiona en la rama por defecto (master).
# Nuestro GitFlow fusiona las PR de feature/fix en develop, así que este workflow cierra entonces las issues enlazadas.
on:
  pull_request:
    types: [closed]
    branches: [develop]

permissions:
  issues: write
  pull-requests: read

jobs:
  close:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Cerrar las issues referenciadas con palabras de cierre
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ github.event.pull_request.body }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          nums=$(printf '%s' "$BODY" | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) +#[0-9]+' | grep -oE '[0-9]+' | sort -u)
          for n in $nums; do
            gh issue close "$n" --repo "$REPO" --reason completed \
              --comment "Cerrada por #$PR (fusionada en \`develop\`). Llegará a producción con la próxima PR de release a \`master\`."
          done
