name: close-linked-issues

# GitHub only auto-closes "Closes #n" when the PR merges into the DEFAULT branch (master).
# Our GitFlow merges feature/fix PRs into develop, so this workflow closes the linked issues then.
on:
  pull_request:
    types: [closed]
    branches: [develop]

permissions:
  issues: write
  pull-requests: read

jobs:
  close:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Close issues referenced with closing keywords
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ github.event.pull_request.body }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          nums=$(printf '%s' "$BODY" | grep -oiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) +#[0-9]+' | grep -oE '[0-9]+' | sort -u)
          for n in $nums; do
            gh issue close "$n" --repo "$REPO" --reason completed \
              --comment "Closed by #$PR (merged into \`develop\`). It ships to production with the next release PR into \`master\`."
          done
